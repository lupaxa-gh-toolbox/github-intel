# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
# =============================================================================
# Site Information
# =============================================================================

site_name: GitHub Intel

site_description: >-
  Monitor an explicit list of GitHub repositories from a local cache,
  with profiles that decide which checks run.

site_author: The Lupaxa Project

site_url: https://github-intel.thelupaxaproject.org/

repo_name: lupaxa-gh-toolbox/github-intel
repo_url: https://github.com/lupaxa-gh-toolbox/github-intel

extra:
  generator: false
  hide_primary_sidebar: false
  language_picker: true
  repo_display_name: github-intel
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/the-lupaxa-project-social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: assets/images/logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs
site_dir: site
use_directory_urls: true
strict: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.sections
    - toc.follow

  palette:
    scheme: slate
    primary: blue
    accent: light blue

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

hooks:
  - hooks/asset_cache_bust.py

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md

  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md

  - Configuration:
      - configuration/index.md
      - Configuration Guide: configuration/configuration-guide.md
      - Configuration Reference: configuration/configuration-reference.md
      - Examples: configuration/examples.md

  - Usage:
      - usage/index.md
      - Commands: usage/commands.md
      - Synchronisation: usage/synchronisation.md
      - Checks: usage/checks.md
      - Terminal Interface: usage/terminal.md
      - Reports: usage/reports.md

  - Reference:
      - reference/index.md
      - Command Reference: reference/command-reference.md
      - Exit Codes: reference/exit-codes.md
      - Troubleshooting: reference/troubleshooting.md
      - Frequently Asked Questions: reference/faq.md
      - Architecture: reference/architecture.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/language-preference.js
  - assets/javascript/header-active-nav.js

# =============================================================================
# Copyright (rendered by overrides/partials/copyright.html)
# =============================================================================
